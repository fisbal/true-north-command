name: Build web, Windows, Mac and Android

# Every build of True North Command ships everywhere at once:
#   checks   the headless playthrough (English and French) and the screen check (phones, tablets, PC, Mac)
#   web      deployed to GitHub Pages (Settings > Pages > Source: GitHub Actions)
#   windows  TrueNorthCommand.exe; installed copies swap in the new version by themselves
#   mac      TrueNorthCommand-mac.zip (Apple silicon and Intel)
#   android  TrueNorthCommand.apk, signed with the game's own key from GitHub secrets
#   release  on main: Release v1.0.N with all of them, version.json for the updater and the source code,
#            plus the rolling "latest" downloads the MartinB OS Hub links to
# Pull requests run the same checks and builds without publishing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.3"
  TNC_VERSION: 1.0.${{ github.run_number }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f godot.zip tpl.tpz

      - name: Stamp the version
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"$TNC_VERSION\"/" project.godot
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"$TNC_VERSION\"/" export_presets.cfg
          sed -i "s/^application\/short_version=.*/application\/short_version=\"$TNC_VERSION\"/; s/^application\/version=.*/application\/version=\"$TNC_VERSION\"/" export_presets.cfg
          grep -n "version" project.godot export_presets.cfg

      # The game's Android key lives only in GitHub secrets, so every new APK installs over the last one.
      # Pull requests build with a throwaway debug key and are never published.
      - name: Android signing
        env:
          KEYSTORE_B64: ${{ secrets.TNC_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TNC_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.config/godot ~/keys
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/keys/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/keys/release.keystore
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=tnc"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::TNC_KEYSTORE_B64 is not set. Add the True North Command secrets (Settings > Secrets and variables > Actions) before releasing."
            exit 1
          else
            echo "::notice::No release key on this build: the APK is signed with a debug key and is not published."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Play every mission (English and French)
        run: |
          godot --headless --import || true
          godot --headless -s tests/autoplay.gd | tee test.log
          grep -q "ALL MISSIONS COMPLETE lang=en" test.log
          godot --headless -s tests/autoplay.gd -- fr | tee test_fr.log
          grep -q "ALL MISSIONS COMPLETE lang=fr" test_fr.log

      - name: Check phones, tablets, PCs and Macs
        run: |
          godot --headless -s tests/screens.gd | tee screens.log
          grep -q "All screens fit" screens.log

      - name: Export builds
        run: |
          mkdir -p build/web build/windows build/android build/mac
          godot --headless --export-release "Web" build/web/index.html
          godot --headless --export-release "Windows" build/windows/TrueNorthCommand.exe
          godot --headless --export-release "Android" build/android/TrueNorthCommand.apk
          godot --headless --export-release "macOS" build/mac/TrueNorthCommand-mac.zip
          rm -f build/android/*.idsig
          ls -la build/*
          test -s build/windows/TrueNorthCommand.exe && test -s build/android/TrueNorthCommand.apk && test -s build/mac/TrueNorthCommand-mac.zip
          echo "{\"build\": ${{ github.run_number }}, \"version\": \"$TNC_VERSION\"}" > build/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TrueNorthCommand-windows
          path: build/windows/TrueNorthCommand.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TrueNorthCommand-android
          path: build/android/TrueNorthCommand.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrueNorthCommand-mac
          path: build/mac/TrueNorthCommand-mac.zip
      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: build/web

      - name: Publish Release v1.0.N (main branch)
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TNC_VERSION }}
          target_commitish: ${{ github.sha }}
          name: True North Command ${{ env.TNC_VERSION }}
          make_latest: true
          body: |
            **True North Command: Operation Alpha** — English and French.

            - **Web**: https://fisbal.github.io/true-north-command/
            - **Android**: TrueNorthCommand.apk (open it from the Files app, then Install). Newer versions install over it.
            - **Windows**: TrueNorthCommand.exe, no installer needed. It updates itself.
            - **Mac** (Apple silicon and Intel): TrueNorthCommand-mac.zip. Unzip, then the first time right-click the app and choose Open.
            - Installed copies check for a new version when they start.
            - Source code: the zip and tar.gz below
          files: |
            build/windows/TrueNorthCommand.exe
            build/android/TrueNorthCommand.apk
            build/mac/TrueNorthCommand-mac.zip
            build/version.json

      - name: Publish rolling "latest" downloads (main branch)
        # Stable links used by the MartinB OS Hub: .../releases/download/latest/TrueNorthCommand.apk and .exe
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: True North Command — dernière version
          prerelease: true
          make_latest: false
          body: |
            Construit automatiquement à chaque mise à jour du jeu (version ${{ env.TNC_VERSION }}).
            - **TrueNorthCommand.apk** : Android (ouvre-le depuis l'app Fichiers).
            - **TrueNorthCommand.exe** : Windows, aucun installateur nécessaire.
            - **TrueNorthCommand-mac.zip** : Mac.
          files: |
            build/windows/TrueNorthCommand.exe
            build/android/TrueNorthCommand.apk
            build/mac/TrueNorthCommand-mac.zip

      - name: Attach builds to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/TrueNorthCommand.exe
            build/android/TrueNorthCommand.apk
            build/mac/TrueNorthCommand-mac.zip

  pages:
    # Needs Settings → Pages → Source: "GitHub Actions" (free on public repos).
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
